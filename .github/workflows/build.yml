name: strongR-frida-arm64-only

on:
  workflow_dispatch:

jobs:
  android_build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1.0.6
      with:
        ndk-version: r25b
    
    - name: Set up Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 -y
        python3 -m pip install lief graphlib

    - name: Build Frida arm64
      shell: bash
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git clone https://github.com/hzzheyang/Patchs.git
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        git clone --recurse-submodules https://github.com/frida/frida
        cd frida
        
        # Применяем скрывающие патчи (hluda)
        for path in ../Patchs/strongR-frida/*
        do
          name=$(basename $path)
          real=$(realpath $path)
          echo "Apply patches to frida/subprojects/$name"
          cd subprojects/$name
          git am ../../../Patchs/strongR-frida/$name/*.patch
          cd ../..
        done
        cd ..
        
        # Компилируем ТОЛЬКО под телефон (arm64), чтобы не ждать час
        mkdir build-android-arm64
        cd build-android-arm64
        ../frida/configure --host=android-arm64
        make

    - name: Upload hluda-server
      uses: actions/upload-artifact@v4
      with:
        name: hluda-server-arm64
        path: build-android-arm64/subprojects/frida-core/server/frida-server
